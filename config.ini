[MQTT]
BROKER_HOST = localhost
BROKER_PORT = 1883
# Subscribing to all Meshtastic traffic
TOPIC_SUB = msh/2/c/#
# Root topic to publish incoming RNS packets
TOPIC_PUB_ROOT = msh/2/c

[RETICULUM]
# If blank, the app will start, print its hash, and wait.
# Set this to the hash of the remote bridge to enable sending.
REMOTE_DESTINATION_HASH = 

[FILTERING]
# -----------------------------
# Hard Blocks (Permitir/Bloquear)
# -----------------------------
# Bloquea paquetes de enrutamiento (Mesh topology). Recomendado: False.
ALLOW_ROUTING = False
# Bloquea estadisticas de bateria/ambiente de otros nodos. Recomendado: False.
ALLOW_TELEMETRY = False
# Bloquea paquetes malformados o no reconocidos. Recomendado: False.
ALLOW_UNKNOWN_APPS = False

# -----------------------------
# Rate Limiting (Segundos entre mensajes)
# -----------------------------
# 300 = 1 posición cada 5 minutos por nodo
POSITION_RATE_LIMIT_SEC = 300
# 3600 = 1 actualización de NodeInfo (nombres/hardware) por hora por nodo
NODEINFO_RATE_LIMIT_SEC = 3600

# Tiempo en cache para bloquear bucles o ecos de la red
DEDUPLICATION_CACHE_SEC = 600
